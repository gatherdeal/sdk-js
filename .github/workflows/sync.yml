name: sync

# Fetches the published API modules and opens a pull request when they change.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open or update the pull request
      actions: write # dispatch ci on the sync branch
    env:
      BRANCH: sync/generated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: fetch and verify the published set
        run: node scripts/generated.mjs sync --out "$RUNNER_TEMP/sync.json"
      - id: result
        name: read the result
        run: |
          node -e '
            const r = require(process.argv[1]);
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/body.md", r.body);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${r.changed}\ntitle=${r.title}\n`);
          ' "$RUNNER_TEMP/sync.json"
      - name: check the updated files
        if: steps.result.outputs.changed == 'true'
        run: node scripts/generated.mjs check
      - name: push the branch and open or update the pull request
        if: steps.result.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.result.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/generated generated.lock.json
          git commit -m "$TITLE"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
