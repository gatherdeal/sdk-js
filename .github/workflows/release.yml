name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; must equal the version in package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: verify, test and pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: version matches package.json and is unreleased
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$VERSION is not a semver version" >&2; exit 1
          fi
          actual="$(node -p 'require("./package.json").version')"
          if [ "$actual" != "$VERSION" ]; then
            echo "package.json has $actual, not $VERSION" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists" >&2; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(if [[ "$VERSION" == *-* ]]; then echo next; else echo latest; fi)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: generated modules are byte-identical to the published set
        run: node scripts/generated.mjs verify-remote
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: pack
        run: |
          mkdir release
          npm pack --pack-destination release
          (cd release && sha256sum "gatherdeal-sdk-$VERSION.tgz" > SHA256SUMS)
      - name: test the packed tarball
        run: |
          npm install --no-save --no-audit --no-fund miniflare@4.20260730.0
          node scripts/smoke.mjs node bun deno types workerd --tarball "release/gatherdeal-sdk-$VERSION.tgz"
      - name: release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git show "$previous:generated.lock.json" > "$RUNNER_TEMP/previous.lock.json"
            node scripts/generated.mjs notes --from "$RUNNER_TEMP/previous.lock.json" > release/notes.md
          else
            node scripts/generated.mjs notes > release/notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing with provenance
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: publish the tested tarball
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          npm publish "./gatherdeal-sdk-$VERSION.tgz" --provenance --access public --ignore-scripts \
            --tag "${{ needs.build.outputs.tag }}"

  github-release:
    name: tag and GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: create the tag and release
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "${{ needs.build.outputs.sha }}" \
            --title "v$VERSION" --notes-file release/notes.md $prerelease \
            "release/gatherdeal-sdk-$VERSION.tgz" release/SHA256SUMS
